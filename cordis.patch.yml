# dsh-multi-acp · profile bundle patch
#
# 用 insert: 机制挂上本插件。!!js 标签里的表达式在配置求值时执行。
#
# ⚠️ 注意：本文件是**本插件自带**的 bundle patch，不是 profile 的
#    $DSH_HOME/profiles/<profile>/cordis.patch.yml（那个含明文凭据，本插件永不写入）。
#
# 引擎定义请通过插件 config.engines 或 $DSH_HOME/multi-acp/engines.json 提供，
# 不要写在这个文件里。

- insert:
    - id: multi-acp
      name: dsh-multi-acp
      config:
        # 默认选中的引擎 id；留空则走官方 DSH agent loop
        defaultEngine: omp
        # 注意：`idleDisposeMs` / `disposeGraceMs`（ACP 子进程空闲回收与退出宽限）
        # **不是插件级配置** —— 它们只在**引擎行**上生效（见 lib/engines.js 的 BUILTIN
        # 与 lib/acp-host.js 的 this.idleDisposeMs）。
        # 之前这两行作为插件配置写在这里，实际从未被读取（ISSUES「死配置」），已删除。
        # 要改就改引擎行：<stateDir>/engines.json 或【引擎管理】里的编辑面板。
        # 引擎状态/会话映射文件；默认 <DSH_HOME>/multi-acp/
        stateDir: !!js (process.env.DSH_HOME || ((process.env.HOME || process.env.USERPROFILE) + '/.dsh')) + '/multi-acp'
        # 引擎注册表。空数组 = 全部来自内置 engines.js + stateDir/engines.json
        engines: []
        # ── 2026-10-09 新增（v0.1.15，详见 docs/evidence/A10-preset-tools-mcp-2026-10-09.md）──
        #
        # acp-* preset 的原生工具组合（会话回落到 DSH 原生 loop 时唯一的工具来源）。
        #   true = 全部 7 组（skills/shell/fs/jobs/todo/ask-user/web，默认）
        #   false = 只要 marker（旧行为，**会导致会话没有 shell/文件系统**，不建议）
        #   ['skills','shell','fs'] = 只挂指定分组
        presetTools: true
        # 用 entry-local 的 dsh-fs-local 遮蔽宿主 sandboxed fs。
        #   false（默认）= 沿用宿主沙箱：写工作区之外会被拒（FS_SANDBOX_DENIED，按设计）
        #   true = 本 preset 的 fs 工具不受沙箱约束（消费侧 tool-fs 与 fs-local 同组，照 minimal preset）
        unsandboxedFs: false
        # MCP 随会话下发（B1）。默认继承 <DSH_HOME>/storages/mcp_connector.json 里 enabled 的连接。
        mcp:
          enabled: true
          # 只下发这些（按连接 name / serverName / serverKey 匹配）；空 = 全部
          include: []
          # 排除这些
          exclude: []
        # 一次 ACP session/prompt 的**总时长闸**（毫秒）。**0（默认）= 不限**。
        # A16（2026-10-10）：原来的 300000 墙钟上限会**误杀正在干活的长任务**
        # （实测 session-503ea973：omp 完成 21 次工具调用、还在思考时被 300s 掐断）。
        # 现在的主闸是下面的 idleTimeoutMs（空闲闸）；这个只作为"极端情况兜底"。
        promptTimeoutMs: 0
        # **空闲闸**（毫秒，默认 180000）：多久**没有任何 session/update** 才算引擎卡死。
        # 只要引擎还在吐消息/调工具就不会触发 —— 长任务（定时采集、大重构）建议保持默认或调大；
        # 0 = 关闭空闲判定（不推荐）。逐引擎可在【引擎管理 → 编辑 → 超时】里覆盖。
        idleTimeoutMs: 180000
        # SKILLS（2026-10-09）：ACP 协议没有 skills 字段，技能靠**磁盘目录**共享。
        # 逐引擎配置在【引擎管理 → 编辑 → SKILLS 目录】里改（落在 <stateDir>/engines.json）：
        #   skillDelivery: auto（引擎自扫 ~/.agents/skills，omp/OpenCode 适用）
        #                | args（启动时追加 --skill <dir>，Command Code 适用，默认值）
        #                | none
        #   skillsDirs:   要暴露给该引擎的目录（空 = ~/.agents/skills，即 DSH 的 skill 目录）
        #   skillArgsTemplate: args 模式的参数写法，默认 ['--skill', '{dir}']
        # 权限模式（2026-10-10）：会话权限档 → 引擎启动档的自动映射（见 lib/permission-bridge.js）。
        #   true（默认）：会话档位为【完全权限】时，引擎自动以"不询问"档启动
        #                （否则定时任务里"审批没人批"会拒掉所有工具，实测 session-8a6cb2e1：11/11 rejected）；
        #                【工作区内修改】/【仅可查看】沿用引擎行设置并打告警。
        #   false：完全不介入，只用引擎行自己的 permissionMode。
        permissionModeFromSession: true
        # 诊断追踪（v0.2.1 / ISSUE-13）：<stateDir>/trace.log —— 排查"factory 装上没 / preset 注册没 /
        # 走了哪条降级分支"的主要证据。
        #   true（默认）= 写默认路径；false / 'off' = **关闭**；'<path>' = 改道到该路径。
        # 为什么要有这个开关：Desktop 从快捷方式启动，用户改不了它的环境变量，配置是唯一可及的开关。
        # 落盘前一律过 lib/trace.js 的中央脱敏（按键名 + 按值的形状 + 截断），但**关掉它最干净**。
        # ⚠️ 若本机 profile 的 patch 整体替换了 config（ISSUE-16），本行不会生效 —— 那时用
        #    插件配置面板或环境变量 DSH_MULTI_ACP_TRACE。
        trace: true
